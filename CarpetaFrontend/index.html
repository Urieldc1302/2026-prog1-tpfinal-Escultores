<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketFlow - Catalogo de Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area">
        <div class="logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            <line x1="8" y1="6" x2="8" y2="18" stroke-dasharray="2 2"></line>
            <line x1="12" y1="10" x2="18" y2="10"></line>
            <line x1="12" y1="14" x2="16" y2="14"></line>
          </svg>
        </div>
        <div class="logo-title">
          <h1>TicketFlow</h1>
          <span class="logo-subtitle">Plataforma de Entradas</span>
        </div>
      </div>

      <div class="user-selector-box">
        <span class="user-selector-label">Usuario activo:</span>
        <select id="userSelect" aria-label="Seleccionar usuario activo">
          <option value="">Cargando usuarios...</option>
        </select>
        <span id="userRoleBadge" class="role-badge role-comprador">Comprador</span>
      </div>
    </div>

    <nav class="nav-tabs" aria-label="Navegacion principal">
      <a href="index.html" class="tab-btn active">Catalogo de Eventos</a>
      <a href="consultar-compra.html" class="tab-btn">Consultar Compra</a>
      <a href="control-acceso.html" class="tab-btn role-organizador-only" style="display: none;">Control de Acceso</a>
      <a href="gestion-eventos.html" class="tab-btn role-organizador-only" style="display: none;">Gestion de Eventos</a>
      <a href="reporte-recaudacion.html" class="tab-btn role-organizador-only" style="display: none;">Reporte de Recaudacion</a>
    </nav>
  </header>

  <main>
    <section class="section-view">
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Eventos Disponibles</h2>
            <p class="card-subtitle">Explora la cartelera y adquiere tus entradas oficiales con confirmacion inmediata.</p>
          </div>
          <button id="btnRefrescarEventos" class="btn btn-outline btn-sm">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Actualizar
          </button>
        </div>
        <div id="eventsGrid" class="events-grid">
          <p class="loading-state">Cargando eventos...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
